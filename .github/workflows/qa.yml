name: QA

on:
  pull_request:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue / feature label for QA_REPORT.md"
        required: false
        default: ""
      skip_e2e:
        description: "Skip Playwright E2E (1 to skip)"
        required: false
        default: "0"

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_ISSUE: ${{ github.event.inputs.issue || github.event.pull_request.title || github.ref_name }}
      QA_SKIP_E2E: ${{ github.event.inputs.skip_e2e || '0' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      QA_FREE_EMAIL: ${{ secrets.QA_FREE_EMAIL }}
      QA_FREE_PASSWORD: ${{ secrets.QA_FREE_PASSWORD }}
      QA_PREMIUM_EMAIL: ${{ secrets.QA_PREMIUM_EMAIL }}
      QA_PREMIUM_PASSWORD: ${{ secrets.QA_PREMIUM_PASSWORD }}
      QA_ALLOW_REMOTE_DB: ${{ secrets.QA_ALLOW_REMOTE_DB }}
      QA_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: env.QA_SKIP_E2E != '1'
        run: pnpm exec playwright install --with-deps chromium

      - name: Skip E2E when secrets missing
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: echo "QA_SKIP_E2E=1" >> "$GITHUB_ENV"

      - name: Full QA
        run: pnpm run qa:full

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-artifacts/playwright-report
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-results
          path: |
            qa-artifacts/test-results
            qa-artifacts/results.json
            qa-artifacts/db-check.json
            QA_REPORT.md
          if-no-files-found: ignore

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: QA_REPORT.md
          if-no-files-found: ignore
